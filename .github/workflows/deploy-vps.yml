name: Validate and deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mapa-disponibilidade-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    services:
      # A migration nunca havia rodado contra Postgres antes de producao.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mapa_ci
          POSTGRES_USER: mapa
          POSTGRES_PASSWORD: mapa-ci
        options: >-
          --health-cmd "pg_isready -U mapa -d mapa_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx

      - name: Run Python checks
        run: |
          python -m py_compile api.py pdf_to_map.py
          python -m pytest -q

      - name: Migration against a real empty Postgres
        env:
          DATABASE_URL: postgresql+psycopg://mapa:mapa-ci@127.0.0.1:5432/mapa_ci
        run: |
          set -euo pipefail
          python -m alembic upgrade head
          # Toda tabela declarada em models.py precisa existir depois do upgrade.
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          import models
          engine = create_engine(os.environ["DATABASE_URL"])
          existing = set(inspect(engine).get_table_names())
          expected = set(models.Base.metadata.tables)
          missing = expected - existing
          if missing:
              raise SystemExit("migration nao criou: %s" % sorted(missing))
          print("migration criou as %d tabelas de models.py" % len(expected))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://map.eterhub.com.br
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package release
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=frontend/node_modules \
            --exclude=frontend/dist \
            --exclude=data \
            --exclude='*.db' \
            -czf "/tmp/mapa-disponibilidade-${GITHUB_SHA}.tar.gz" .

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            "/tmp/mapa-disponibilidade-${GITHUB_SHA}.tar.gz" \
            "${VPS_USER}@${VPS_HOST}:/tmp/mapa-disponibilidade-${GITHUB_SHA}.tar.gz"

      - name: Activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # O script remoto vive em deploy/remote-release.sh, versionado. Antes
          # ele era um heredoc na stdin do ssh: o passo terminava em 2 segundos,
          # sem imprimir nada, e era marcado como sucesso sem ter publicado.
          scp -i ~/.ssh/deploy_key deploy/remote-release.sh \
            "${VPS_USER}@${VPS_HOST}:/tmp/remote-release-${GITHUB_SHA}.sh"
          ssh -n -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            "bash /tmp/remote-release-${GITHUB_SHA}.sh '${GITHUB_SHA}'; \
             estado=\$?; rm -f /tmp/remote-release-${GITHUB_SHA}.sh; exit \$estado"

      - name: Verificacao externa em producao
        env:
          PUBLIC_URL: https://map.eterhub.com.br
        run: |
          set -euo pipefail
          # O health check anterior roda em loopback dentro da VPS: ele nao prova
          # que o Nginx e o TLS estao entregando a aplicacao para o usuario.
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error --max-time 15 "$PUBLIC_URL/health" >/dev/null; then
              echo "Producao respondendo em $PUBLIC_URL/health"
              exit 0
            fi
            sleep 6
          done
          echo "A aplicacao subiu na VPS mas nao respondeu publicamente em $PUBLIC_URL/health"
          exit 1
