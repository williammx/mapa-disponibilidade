name: Validate and deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mapa-disponibilidade-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run Python checks
        run: |
          python -m py_compile api.py pdf_to_map.py
          python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://map.eterhub.com.br
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package release
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=frontend/node_modules \
            --exclude=frontend/dist \
            --exclude=data \
            --exclude='*.db' \
            -czf "/tmp/mapa-disponibilidade-${GITHUB_SHA}.tar.gz" .

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            "/tmp/mapa-disponibilidade-${GITHUB_SHA}.tar.gz" \
            "${VPS_USER}@${VPS_HOST}:/tmp/mapa-disponibilidade-${GITHUB_SHA}.tar.gz"

      - name: Activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" "bash -s -- '${GITHUB_SHA}'" <<'REMOTE'
          set -euo pipefail

          SHA="$1"
          APP_DIR="/opt/mapa-disponibilidade"
          ARCHIVE="/tmp/mapa-disponibilidade-${SHA}.tar.gz"
          RELEASE_DIR="/tmp/mapa-disponibilidade-${SHA}"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"

          test -f "$APP_DIR/.env"
          sudo rsync -a --delete \
            --exclude=.env \
            "$RELEASE_DIR/" "$APP_DIR/"
          sudo chown -R "$USER":"$USER" "$APP_DIR"

          cd "$APP_DIR"
          docker compose config -q
          docker compose up -d --build --remove-orphans

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null; then
              docker compose ps
              rm -rf "$RELEASE_DIR" "$ARCHIVE"
              exit 0
            fi
            sleep 4
          done

          docker compose ps
          docker compose logs --tail=120 mapa-disponibilidade
          exit 1
          REMOTE
