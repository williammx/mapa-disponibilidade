<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal | Mapa de Disponibilidade</title>
<style>
:root{--bg:#0d1216;--panel:#141c22;--panel2:#192329;--line:#2e3c45;--text:#eef4f2;--muted:#94a5ac;--accent:#35d58a;--ink:#06271a;--warn:#f1bf66}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI Variable",system-ui,sans-serif}.top{height:62px;display:flex;align-items:center;gap:14px;padding:0 28px;border-bottom:1px solid #26333b;background:#10171c}.brand{display:flex;align-items:center;gap:10px;font-weight:760}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--ink);font-size:13px}.top .spacer{flex:1}.user{color:var(--muted);font-size:12px}.outline,button{height:36px;border:1px solid #3a4a55;border-radius:6px;background:#1b252c;color:var(--text);padding:0 12px;font:inherit;font-size:12px;font-weight:650;cursor:pointer}.outline:hover,button:hover{border-color:#60717d;background:#233038}.primary{border-color:var(--accent);background:var(--accent);color:var(--ink)}.primary:hover{background:#55df9e}.shell{display:grid;grid-template-columns:238px 1fr;min-height:calc(100vh - 62px)}aside{padding:24px 16px;border-right:1px solid #26333b;background:#11181d}.navLabel{padding:0 10px;color:#74868e;font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}.nav{display:grid;gap:4px;margin-top:10px}.nav button{display:flex;align-items:center;width:100%;border-color:transparent;background:transparent;text-align:left}.nav button.active{background:#1d2a30;color:var(--accent)}main{padding:clamp(24px,4vw,48px);max-width:1440px;width:100%;margin:auto}.head{display:flex;align-items:flex-end;gap:18px;justify-content:space-between}.eyebrow{color:var(--accent);font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}.head h1{margin:5px 0 0;font-size:clamp(25px,3vw,34px);letter-spacing:0}.head p{margin:6px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:34px}.stat,.project{border:1px solid var(--line);border-radius:7px;background:var(--panel)}.stat{padding:18px}.stat span{color:var(--muted);font-size:11px}.stat strong{display:block;margin-top:6px;font-size:25px}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-top:40px}.sectionHead h2{margin:0;font-size:16px}.sectionHead span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px;margin-top:14px}.project{min-height:148px;padding:18px}.project .badge{display:inline-flex;padding:3px 7px;border:1px solid #3c4d55;border-radius:999px;color:#c3d0d3;font-size:10px}.project h3{margin:16px 0 4px;font-size:16px}.project p{margin:0;color:var(--muted);font-size:12px}.empty{padding:38px;border:1px dashed #3a4a54;border-radius:7px;color:var(--muted);text-align:center}.modal{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:rgba(3,7,9,.7)}.modal.active{display:grid}.dialog{width:min(440px,100%);padding:25px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.dialog h2{margin:0;font-size:19px}.dialog p{margin:6px 0 20px;color:var(--muted);font-size:12px}.dialog form{display:grid;gap:14px}.dialog label{display:grid;gap:6px;font-size:12px;color:#c8d2d5}.dialog input,.dialog textarea,.dialog select{min-height:40px;border:1px solid var(--line);border-radius:6px;background:#0e151a;color:var(--text);padding:9px 10px;font:inherit}.dialog textarea{min-height:88px;resize:vertical}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}.error{min-height:18px;color:#ff9d84;font-size:12px}@media(max-width:780px){.top{padding:0 16px}.user{display:none}.shell{grid-template-columns:1fr}aside{display:none}main{padding:26px 18px}.head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}.actions{width:100%}.actions button{flex:1}}
</style>
<style>
/* Detail workspace styles kept separate from the dashboard baseline. */
.detail{width:min(760px,100%);margin-top:30px;padding:28px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.detail form{display:grid;gap:18px}.detail .field{display:grid;gap:7px;color:#c8d2d5;font-size:12px;font-weight:650}.detail .field input,.detail .field textarea,.detail .field select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:6px;background:#0e151a;color:var(--text);padding:10px 11px;font:inherit}.detail .field textarea{min-height:112px;resize:vertical}.detail .field input:focus,.detail .field textarea:focus,.detail .field select:focus{outline:2px solid var(--accent);outline-offset:2px}.detail .actions{margin-top:4px}.detail .notice{margin:12px 0 0;padding:13px 14px;border-left:3px solid var(--accent);border-radius:0 6px 6px 0;background:#15231e;color:#c9d8d1;font-size:12px}.head .actions a{text-decoration:none}.head .actions a button{height:36px}.panel{margin-top:26px;border-top:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row h3{margin:0;font-size:14px}.row p{margin:4px 0 0;color:var(--muted);font-size:12px}.actions.wrap{flex-wrap:wrap}@media(max-width:780px){.detail{padding:20px}.head .actions{width:auto}.row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="mark">M</span>Mapa de Disponibilidade</div><span class="spacer"></span><span class="user" id="userName"></span><button class="outline" id="logout">Sair</button></header>
<div class="shell"><aside><div class="navLabel">Workspace</div><nav class="nav"><button class="active" data-view="projects">Projetos</button><button id="clientsNav" data-view="clients" hidden>Clientes</button><button data-view="activity">Atividade</button></nav><div class="navLabel" style="margin-top:28px">Conta</div><nav class="nav"><button data-view="profile">Perfil</button><button data-view="preferences">Preferencias</button></nav></aside>
<main id="view"></main></div>
<div class="modal" id="clientModal"><div class="dialog"><h2>Novo cliente</h2><p>Crie a organizacao que representara a imobiliaria.</p><form id="clientForm"><label>Nome<input id="clientName" required minlength="2"></label><label>Identificador<input id="clientSlug" required placeholder="imobiliaria-exemplo" autocapitalize="off" spellcheck="false"></label><div class="error" id="clientError"></div><div class="modalActions"><button type="button" class="outline" data-close="clientModal">Cancelar</button><button class="primary">Criar cliente</button></div></form></div></div>
<div class="modal" id="projectModal"><div class="dialog"><h2>Novo projeto</h2><p>O projeto inicia como rascunho e ainda nao fica visivel para o cliente.</p><form id="projectForm"><label>Cliente<select id="projectOrganization" required></select></label><label>Nome<input id="projectName" required minlength="2"></label><label>Identificador<input id="projectSlug" required placeholder="residencial-aurora" autocapitalize="off" spellcheck="false"></label><label>Descricao<textarea id="projectDescription"></textarea></label><div class="error" id="projectError"></div><div class="modalActions"><button type="button" class="outline" data-close="projectModal">Cancelar</button><button class="primary">Criar rascunho</button></div></form></div></div>
<script type="text/plain">
const $=s=>document.querySelector(s);function slugify(value){return value.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}for(const input of document.querySelectorAll('#clientSlug,#projectSlug'))input.addEventListener('blur',()=>{input.value=slugify(input.value)});let state={me:null,organizations:[],projects:[]};async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let d={};try{d=await r.json()}catch(_){}if(r.status===401){location.assign('/login');throw new Error('Sessao expirada.')}if(!r.ok)throw new Error(d.detail||'Nao foi possivel concluir a operacao.');return d}function modal(id,on){$('#'+id).classList.toggle('active',on)}function render(){const user=state.me.user,admin=['platform_admin','operator'].includes(user.platform_role);$('#userName').textContent=user.name;$('#scope').textContent=admin?'Operacao interna':'Portal do cliente';$('#heading').textContent=admin?'Projetos e entregas':'Seus projetos';$('#subheading').textContent=admin?'Gerencie clientes, rascunhos e publicacoes.':'Mapas liberados para sua organizacao.';$('#clientsNav').hidden=!admin;$('#newClient').hidden=!admin;$('#newProject').hidden=!admin;$('#organizationCount').textContent=state.organizations.length;$('#activeCount').textContent=state.projects.filter(p=>p.status==='published'||p.status==='draft').length;$('#reviewCount').textContent=state.projects.filter(p=>p.status==='review').length;$('#projectInfo').textContent=state.projects.length+' projeto'+(state.projects.length===1?'':'s');const grid=$('#projectGrid');grid.replaceChildren();if(!state.projects.length){grid.innerHTML='<div class="empty">Nenhum projeto foi criado ou liberado ainda.</div>';return}for(const p of state.projects){const e=document.createElement('article');e.className='project';e.innerHTML='<span class="badge">'+(p.status==='draft'?'Rascunho':p.status)+'</span><h3></h3><p></p>';e.querySelector('h3').textContent=p.name;e.querySelector('p').textContent=p.description||'Projeto sem descricao.';grid.append(e)}}async function load(){state.me=await api('/api/auth/me');state.organizations=(await api('/api/organizations')).organizations;state.projects=(await api('/api/projects')).projects;const select=$('#projectOrganization');select.replaceChildren(...state.organizations.map(o=>new Option(o.name,o.id)));render()}for(const e of document.querySelectorAll('[data-close]'))e.onclick=()=>modal(e.dataset.close,false);$('#newClient').onclick=()=>modal('clientModal',true);$('#newProject').onclick=()=>modal('projectModal',true);$('#clientForm').onsubmit=async e=>{e.preventDefault();$('#clientError').textContent='';try{const slug=slugify($('#clientSlug').value);$('#clientSlug').value=slug;await api('/api/organizations',{method:'POST',body:JSON.stringify({name:$('#clientName').value,slug})});modal('clientModal',false);e.target.reset();await load()}catch(err){$('#clientError').textContent=err.message}};$('#projectForm').onsubmit=async e=>{e.preventDefault();$('#projectError').textContent='';try{const org=$('#projectOrganization').value,slug=slugify($('#projectSlug').value);$('#projectSlug').value=slug;await api('/api/organizations/'+org+'/projects',{method:'POST',body:JSON.stringify({name:$('#projectName').value,slug,description:$('#projectDescription').value||null})});modal('projectModal',false);e.target.reset();await load()}catch(err){$('#projectError').textContent=err.message}};$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.assign('/login')};load().catch(err=>console.error(err));
</script>
<script>
const app=document.querySelector('#view'),qs=s=>document.querySelector(s),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={me:null,organizations:[],projects:[],view:'projects'};
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let d={};try{d=await r.json()}catch(_){}if(r.status===401){location.assign('/login');throw Error('Sessao expirada.')}if(!r.ok)throw Error(d.detail||'Nao foi possivel concluir a operacao.');return d}
function setNav(view){state.view=view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()}
function head(kicker,title,text,actions=''){return `<div class="head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${text}</p></div><div class="actions wrap">${actions}</div></div>`}
function statusLabel(s){return({draft:'Rascunho',review:'Em revisao',published:'Publicado',paused:'Pausado',archived:'Arquivado'})[s]||s}
function renderProjects(){const admin=['platform_admin','operator'].includes(state.me.user.platform_role),active=state.projects.filter(p=>!['archived','paused'].includes(p.status)).length,review=state.projects.filter(p=>p.status==='review').length;app.innerHTML=head(admin?'Operacao interna':'Portal do cliente',admin?'Projetos e entregas':'Seus projetos',admin?'Gerencie clientes, rascunhos e publicacoes.':'Mapas liberados para sua organizacao.',admin?'<button class="outline" data-action="new-client">Novo cliente</button><button class="primary" data-action="new-project">Novo projeto</button>':'')+`<section class="stats"><div class="stat"><span>Projetos ativos</span><strong>${active}</strong></div><div class="stat"><span>Em revisao</span><strong>${review}</strong></div><div class="stat"><span>Organizacoes</span><strong>${state.organizations.length}</strong></div></section><div class="sectionHead"><h2>Projetos recentes</h2><span>${state.projects.length} projeto${state.projects.length===1?'':'s'}</span></div><section class="grid">${state.projects.length?state.projects.map(p=>`<article class="project"><span class="badge">${statusLabel(p.status)}</span><h3>${escapeHtml(p.name)}</h3><p>${escapeHtml(p.description||'Projeto sem descricao.')}</p><button data-project="${p.id}">Abrir projeto</button></article>`).join(''):'<div class="empty">Nenhum projeto foi criado ou liberado ainda.</div>'}</section>`}
function renderClients(){app.innerHTML=head('Operacao interna','Clientes','Organizacoes atendidas e seus projetos.','<button class="primary" data-action="new-client">Novo cliente</button>')+`<section class="panel">${state.organizations.length?state.organizations.map(o=>{const count=state.projects.filter(p=>p.organization_id===o.id).length;return `<div class="row"><div><h3>${escapeHtml(o.name)}</h3><p>${escapeHtml(o.slug)} · ${count} projeto${count===1?'':'s'}</p></div><button data-client="${o.id}">Ver projetos</button></div>`}).join(''):'<div class="empty">Nenhum cliente cadastrado.</div>'}</section>`}
async function renderActivity(){app.innerHTML=head('Operacao interna','Atividade','Acoes registradas na plataforma.')+'<section class="panel"><div class="empty">Carregando atividade...</div></section>';try{const data=await api('/api/activity');app.querySelector('.panel').innerHTML=data.events.length?data.events.map(e=>`<div class="row"><div><h3>${escapeHtml(e.actor_name)} · ${escapeHtml(e.action.replaceAll('_',' '))}</h3><p>${new Date(e.created_at).toLocaleString('pt-BR')} · ${escapeHtml(e.target_type)}</p></div></div>`).join(''):'<div class="empty">Ainda nao ha atividades registradas.</div>'}catch(err){app.querySelector('.panel').innerHTML=`<div class="empty">${escapeHtml(err.message)}</div>`}}
function renderProfile(){const u=state.me.user;app.innerHTML=head('Conta','Perfil','Atualize seus dados e senha.')+`<section class="detail panel"><form id="profileForm"><label class="field">Nome<input id="profileName" value="${escapeHtml(u.name)}" required minlength="2"></label><div class="actions" style="margin-top:16px"><button class="primary">Salvar perfil</button></div><div class="error" id="profileError"></div></form><form id="passwordForm" style="margin-top:34px"><h2 style="font-size:16px">Alterar senha</h2><label class="field">Senha atual<input id="currentPassword" type="password" required></label><label class="field">Nova senha<input id="newPassword" type="password" minlength="12" required></label><div class="actions" style="margin-top:16px"><button>Atualizar senha</button></div><div class="error" id="passwordError"></div></form></section>`}
function renderPreferences(){const compact=localStorage.getItem('compactLists')==='true';app.innerHTML=head('Conta','Preferencias','Ajustes pessoais deste navegador.')+`<section class="detail panel"><label class="field"><span>Listas compactas</span><select id="compactLists"><option value="false" ${compact?'':'selected'}>Padrao</option><option value="true" ${compact?'selected':''}>Compacta</option></select></label><p class="notice">Estas preferencias sao aplicadas somente neste navegador.</p></section>`;qs('#compactLists').onchange=e=>{localStorage.setItem('compactLists',e.target.value);renderPreferences()}}
async function renderProject(id){app.innerHTML=head('Projeto','Carregando projeto','');const data=await api('/api/projects/'+id),p=data.project,o=data.organization;app.innerHTML=head('Projeto',''+escapeHtml(p.name),escapeHtml(o.name)+' · '+escapeHtml(p.slug),`<button class="outline" data-view="projects">Voltar</button><a href="/" target="_blank"><button class="primary">Abrir gerador</button></a>`)+`<section class="detail panel"><form id="projectEdit"><label class="field">Nome<input id="editName" value="${escapeHtml(p.name)}" required></label><label class="field">Descricao<textarea id="editDescription">${escapeHtml(p.description||'')}</textarea></label><label class="field">Estado<select id="editStatus">${['draft','review','published','paused','archived'].map(x=>`<option value="${x}" ${p.status===x?'selected':''}>${statusLabel(x)}</option>`).join('')}</select></label><label class="field">Acesso<select id="editAccess"><option value="private" ${p.access_mode==='private'?'selected':''}>Privado - somente usuarios autorizados</option><option value="link" ${p.access_mode==='link'?'selected':''}>Por link - configuracao futura</option><option value="public" ${p.access_mode==='public'?'selected':''}>Publico - configuracao futura</option></select></label><div class="actions" style="margin-top:20px"><button class="primary">Salvar alteracoes</button></div><div id="projectEditError" class="error"></div></form><p class="notice">O gerador atual abre em uma nova aba. A proxima entrega liga o upload e o resultado do PDF a esta versao do projeto.</p></section>`;qs('#projectEdit').onsubmit=async e=>{e.preventDefault();try{const out=await api('/api/projects/'+p.id,{method:'PATCH',body:JSON.stringify({name:qs('#editName').value,description:qs('#editDescription').value||null,status:qs('#editStatus').value,access_mode:qs('#editAccess').value})});const i=state.projects.findIndex(x=>x.id===p.id);state.projects[i]=out.project;renderProject(p.id)}catch(err){qs('#projectEditError').textContent=err.message}}}
function render(){if(state.view==='projects')renderProjects();else if(state.view==='clients')renderClients();else if(state.view==='activity')renderActivity();else if(state.view==='profile')renderProfile();else renderPreferences()}
async function load(){state.me=await api('/api/auth/me');state.organizations=(await api('/api/organizations')).organizations;state.projects=(await api('/api/projects')).projects;qs('#userName').textContent=state.me.user.name;qs('#clientsNav').hidden=!['platform_admin','operator'].includes(state.me.user.platform_role);render()}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){e.preventDefault();setNav(nav.dataset.view)}const card=e.target.closest('[data-project]');if(card)renderProject(card.dataset.project);const client=e.target.closest('[data-client]');if(client){state.view='projects';renderProjects()}const close=e.target.closest('[data-close]');if(close)qs('#'+close.dataset.close).classList.remove('active');if(e.target.closest('[data-action="new-client"]'))qs('#clientModal').classList.add('active');if(e.target.closest('[data-action="new-project"]')){const select=qs('#projectOrganization');select.replaceChildren(...state.organizations.map(o=>new Option(o.name,o.id)));qs('#projectModal').classList.add('active')}});
qs('#clientForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/organizations',{method:'POST',body:JSON.stringify({name:qs('#clientName').value,slug:qs('#clientSlug').value})});state.organizations.push(d.organization);qs('#clientModal').classList.remove('active');e.target.reset();render()}catch(err){qs('#clientError').textContent=err.message}};qs('#projectForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/organizations/'+qs('#projectOrganization').value+'/projects',{method:'POST',body:JSON.stringify({name:qs('#projectName').value,slug:qs('#projectSlug').value,description:qs('#projectDescription').value||null})});state.projects.unshift(d.project);qs('#projectModal').classList.remove('active');e.target.reset();setNav('projects')}catch(err){qs('#projectError').textContent=err.message}};qs('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.assign('/login')};document.addEventListener('submit',async e=>{if(e.target.id==='profileForm'){e.preventDefault();try{const d=await api('/api/profile',{method:'PATCH',body:JSON.stringify({name:qs('#profileName').value})});state.me.user=d.user;qs('#userName').textContent=d.user.name;renderProfile()}catch(err){qs('#profileError').textContent=err.message}}if(e.target.id==='passwordForm'){e.preventDefault();try{await api('/api/auth/password',{method:'POST',body:JSON.stringify({current_password:qs('#currentPassword').value,new_password:qs('#newPassword').value})});e.target.reset();qs('#passwordError').textContent='Senha atualizada.'}catch(err){qs('#passwordError').textContent=err.message}}});load().catch(console.error);
</script>
</body>
</html>
