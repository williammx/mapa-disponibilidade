<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#15171a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eee;overflow:hidden}
  #app{position:fixed;inset:0}
  #map{width:100%;height:100%;display:block;touch-action:none;background:#fff;cursor:grab}
  #map.draw{cursor:crosshair}
  .lot{stroke-width:.5;cursor:pointer;transition:fill-opacity .1s}
  .s0{fill:#26d07c;fill-opacity:.5;stroke:#0f7a4d}.s1{fill:#6e6d67;fill-opacity:.5;stroke:#3f3e3a}.s2{fill:#e0613b;fill-opacity:.55;stroke:#8a2f15}
  .lot:hover{fill-opacity:.82}.lot.sel{stroke:#111;stroke-width:1.6}
  .draftpt{fill:#1b6cf0;stroke:#fff;stroke-width:1}.draftline{fill:none;stroke:#1b6cf0;stroke-width:1.5;stroke-dasharray:4 3}
  .panel{position:absolute;background:rgba(28,30,34,.94);border:1px solid #383b40;border-radius:12px;padding:8px 11px;backdrop-filter:blur(6px)}
  #title{top:12px;left:12px;font-weight:700;font-size:14px}#title small{display:block;font-weight:400;color:#a9aab0;font-size:11.5px;margin-top:2px}
  #legend{bottom:12px;left:12px;font-size:12.5px;line-height:1.9}#legend .row{display:flex;align-items:center;gap:8px}#legend i{width:13px;height:13px;border-radius:3px;display:inline-block}
  #zoom{top:12px;right:12px;display:flex;flex-direction:column;gap:6px;background:none;border:none;padding:0}
  #zoom button{width:38px;height:38px;border-radius:10px;border:1px solid #383b40;background:rgba(28,30,34,.92);color:#eee;font-size:19px;cursor:pointer}
  #edit{top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center;max-width:94vw}
  #edit button{background:#1f242c;color:#eee;border:1px solid #2c313a;border-radius:8px;padding:7px 10px;font-size:12.5px;cursor:pointer}
  #edit button.on{background:#26d07c;color:#06281a;border-color:#26d07c;font-weight:700}
  #edit .st{width:30px;font-size:15px;text-align:center}#edit .sep{width:1px;height:22px;background:#333;margin:0 2px}
  #edhint{font-size:11.5px;color:#a9aab0;width:100%;text-align:center;margin-top:2px}
  #info{bottom:12px;right:12px;min-width:140px;display:none}#info .h{font-weight:700;font-size:14px}
  #lrot{bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-size:12.5px}#lrot input[type=range]{width:190px;max-width:42vw;accent-color:#1b6cf0}#lrot button{background:#1f242c;color:#eee;border:1px solid #2c313a;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}#lrot button.on{background:#1b6cf0;color:#fff;border-color:#1b6cf0}#lrot b{min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}
</style></head><body>
