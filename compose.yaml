services:
  db:
    image: postgres:16-alpine
    container_name: mapa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mapa}
      POSTGRES_USER: ${POSTGRES_USER:-mapa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mapa-local}
    volumes:
      - mapa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mapa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mapa_redis_data:/data

  mapa-disponibilidade:
    build: .
    container_name: mapa-disponibilidade
    restart: unless-stopped
    environment:
      PORT: "7860"
      # Sem esta variavel o gate de /docs, /redoc e /openapi.json nunca fecha:
      # o mapa completo de rotas e schemas ficava publico para qualquer visitante.
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mapa:mapa-local@db:5432/mapa}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_DAYS: ${SESSION_DAYS:-14}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      PRIVATE_STORAGE_DIR: /data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8000:7860"
    volumes:
      - mapa_project_data:/data

  worker:
    build: .
    container_name: mapa-worker
    restart: unless-stopped
    healthcheck:
      disable: true
    command: ["sh", "-c", "alembic upgrade head && rq worker pdf-processing --url ${REDIS_URL:-redis://redis:6379/0}"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mapa:mapa-local@db:5432/mapa}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PRIVATE_STORAGE_DIR: /data/storage
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-900}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - mapa_project_data:/data

volumes:
  mapa_postgres_data:
  mapa_project_data:
  mapa_redis_data:
